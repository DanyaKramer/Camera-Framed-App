name: CameraApp

# Single source of truth for the Xcode project.
# The .xcodeproj is GENERATED from this file by `Tools/bootstrap.sh` (XcodeGen).
# Do not hand-edit the generated project — it is rebuilt from scratch.

options:
  bundleIdPrefix: com.frameapp
  deploymentTarget:
    iOS: "17.0"
  # Mirror the real folder structure in Xcode's navigator.
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: "YES"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    GCC_C_LANGUAGE_STANDARD: gnu17

targets:
  CameraApp:
    type: application
    platform: iOS

    # Every .swift and .xcassets under CameraApp/ is picked up automatically.
    sources:
      - path: CameraApp

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frameapp.CameraApp
        PRODUCT_NAME: CameraApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Frame
        INFOPLIST_KEY_NSCameraUsageDescription: "Нужен доступ к камере, чтобы снимать фотографии."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Нужен доступ к фотоальбому, чтобы сохранять снятые фотографии."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"

        ENABLE_PREVIEWS: "YES"

schemes:
  CameraApp:
    build:
      targets:
        CameraApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release